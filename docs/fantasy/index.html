<script>/* SAA / SAR engine (client side). Mirrors saa_engine.py, which is validated against the workbook to ~1e-14.
   Pure functions, no DOM -- shared by the page and by the node parity test. */
const SK_CATS_F = ['GP','G','A','P2GA','PIM','SOG','STP','Hit','Blk','TK','Cor'];
const SK_CATS_D = ['GP','PTD','G','A','P2GA','PIM','SOG','STP','Hit','Blk','TK','Cor'];
const SK_PG = ['PTD','G','A','P2GA','PIM','SOG','STP','Hit','Blk','TK','Cor'];
const G_CATS = ['GP','W','GAA','SV','SHO'];
const G_MIN_GP = 5;

function xlRound(x, nd = 2) {               // Excel ROUND: half away from zero
  const m = Math.pow(10, nd);
  return Math.sign(x) * Math.floor(Math.abs(x) * m + 0.5 + 1e-9) / m;
}
function median(a) {
  if (!a.length) return NaN;
  const s = a.slice().sort((x, y) => x - y), n = s.length;
  return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2;
}
function sd(a) {                              // sample SD (Excel STDEV)
  const n = a.length; if (n < 2) return NaN;
  const m = a.reduce((x, y) => x + y, 0) / n;
  return Math.sqrt(a.reduce((x, y) => x + (y - m) * (y - m), 0) / (n - 1));
}
function percentileInc(a, p) {                // Excel PERCENTILE.INC
  if (!a.length) return 0;
  const s = a.slice().sort((x, y) => x - y), k = (s.length - 1) * p, f = Math.floor(k), c = Math.min(f + 1, s.length - 1);
  return s[f] + (s[c] - s[f]) * (k - f);
}

/* Window totals for one player. seasons = list of season keys to pool (e.g. ['2526','2627']).
   Skater season record: {gp,g,a,pim,sog,stp,hit,blk,tk,cf,ca}. Pooled by summing totals (== games-weighted).
   A stat that is missing (null) in a season is pooled only over seasons where it exists. */
function skaterWindow(p, seasons) {
  const t = { GP: 0, G: 0, A: 0, PIM: 0, SOG: 0, STP: 0, Hit: 0, Blk: 0, TK: 0, Cor: 0 };
  const gpFor = { TK: 0, Cor: 0 };           // games where the stat exists
  let any = false;
  for (const s of seasons) {
    const r = p.s && p.s[s]; if (!r || !r.gp) continue;
    any = true; t.GP += r.gp; t.G += r.g || 0; t.A += r.a || 0; t.PIM += r.pim || 0; t.SOG += r.sog || 0;
    t.STP += r.stp || 0; t.Hit += r.hit || 0; t.Blk += r.blk || 0;
    if (r.tk != null) { t.TK += r.tk; gpFor.TK += r.gp; }
    if (r.cf != null && r.ca != null) { t.Cor += r.cf - r.ca; gpFor.Cor += r.gp; }
  }
  if (!any) return null;
  t.gpFor = gpFor; return t;
}

function perGame(t, grp) {
  const pg = {};
  const q = (x, g) => (g > 0 ? xlRound(x / g) : NaN);
  pg.G = q(t.G, t.GP); pg.A = q(t.A, t.GP);
  pg.PTD = grp === 'D' ? q(t.G + t.A, t.GP) : NaN;
  pg.P2GA = q(2 * t.G + t.A, t.GP);
  pg.PIM = q(t.PIM, t.GP); pg.SOG = q(t.SOG, t.GP); pg.STP = q(t.STP, t.GP);
  pg.Hit = q(t.Hit, t.GP); pg.Blk = q(t.Blk, t.GP);
  pg.TK = t.gpFor.TK ? xlRound(t.TK / t.gpFor.TK) : NaN;
  pg.Cor = t.gpFor.Cor ? xlRound(t.Cor / t.gpFor.Cor) : NaN;
  return pg;
}
const catVal = (r, c) => (c === 'GP' ? r.GP : r.pg[c]);
const finite = (a) => a.filter((v) => Number.isFinite(v));

/* rows: [{grp:'F'|'D', GP, pg:{...}, pool:bool, fa:bool}]  ->  params per group */
function skaterParams(rows, useGP = true) {
  const P = {};
  for (const grp of ['F', 'D']) {
    const g = rows.filter((r) => r.grp === grp);
    const ros = g.filter((r) => r.pool), fa = g.filter((r) => r.fa);
    const fgp = fa.filter((r) => r.GP > 0).map((r) => r.GP);
    const thr = fgp.length ? percentileInc(fgp, 0.25) : 0;
    const fq = fa.filter((r) => r.GP > thr);
    const p = { threshold: thr, nPool: ros.length, nRepl: fq.length };
    for (const c of (grp === 'D' ? SK_CATS_D : SK_CATS_F)) {
      const vr = finite(ros.map((r) => catVal(r, c))), vf = finite(fq.map((r) => catVal(r, c)));
      p[c] = { med: median(vr), sd: sd(vr), repl: median(vf) };
    }
    P[grp] = p;
  }
  return P;
}
/* adds r.saa{cat}, r.sar{cat}, r.tSAA, r.tSAR (NaN when GP < floor) */
function scoreSkaters(rows, P, floor = 0, useGP = true) {
  for (const r of rows) {
    const cats = (r.grp === 'D' ? SK_CATS_D : SK_CATS_F).filter((c) => useGP || c !== 'GP');
    r.saa = {}; r.sar = {}; let ta = 0, tr = 0;
    for (const c of (r.grp === 'D' ? SK_CATS_D : SK_CATS_F)) {
      const q = P[r.grp][c], v = catVal(r, c);
      const a = (v - q.med) / q.sd, s = (v - q.repl) / q.sd;
      r.saa[c] = Number.isFinite(a) ? a : null; r.sar[c] = Number.isFinite(s) ? s : null;
      if (cats.includes(c)) { ta += Number.isFinite(a) ? a : 0; tr += Number.isFinite(s) ? s : 0; }
    }
    const low = r.GP < floor;
    r.tSAA = low ? NaN : ta; r.tSAR = low ? NaN : tr;
  }
  return rows;
}

/* goalies: window totals, pooled GAA = 60*GA/MIN (falls back to GP-weighted GAA), SV% = 1 - GA/SA */
function goalieWindow(p, seasons) {
  let gp = 0, w = 0, so = 0, ga = 0, sa = 0, mn = 0, gaaW = 0, gaaG = 0, svW = 0, svG = 0, any = false;
  for (const s of seasons) {
    const r = p.s && p.s[s]; if (!r || !r.gp) continue;
    any = true; gp += r.gp; w += r.w || 0; so += r.so || 0;
    if (r.ga != null && r.sa) { ga += r.ga; sa += r.sa; }
    if (r.min) mn += r.min;
    if (r.gaa != null) { gaaW += r.gaa * r.gp; gaaG += r.gp; }
    if (r.sv != null) { svW += r.sv * r.gp; svG += r.gp; }
  }
  if (!any) return null;
  const gaa = mn > 0 && ga ? (60 * ga) / mn : (gaaG ? gaaW / gaaG : NaN);
  const sv = sa > 0 ? (sa - ga) / sa : (svG ? svW / svG : NaN);
  return { GP: gp, W: w, GAA: gaa, SV: sv, SHO: so };
}
function goalieParams(rows) {
  const ros = rows.filter((r) => r.pool), fa = rows.filter((r) => r.fa);
  const fgp = fa.filter((r) => r.GP > 0).map((r) => r.GP);
  const thr = fgp.length ? percentileInc(fgp, 0.25) : 0;
  const fq = fa.filter((r) => r.GP > thr);
  const p = { threshold: thr, nPool: ros.length, nRepl: fq.length };
  for (const c of G_CATS) {
    const vr = finite(ros.map((r) => r[c])), vf = finite(fq.map((r) => r[c]));
    p[c] = { med: median(vr), sd: sd(vr), repl: median(vf) };
  }
  return p;
}
function scoreGoalies(rows, P, floor = G_MIN_GP) {
  for (const r of rows) {
    r.saa = {}; r.sar = {}; let ta = 0, tr = 0;
    for (const c of G_CATS) {
      const q = P[c], sg = c === 'GAA' ? -1 : 1;
      const a = (sg * (r[c] - q.med)) / q.sd, s = (sg * (r[c] - q.repl)) / q.sd;
      r.saa[c] = Number.isFinite(a) ? a : null; r.sar[c] = Number.isFinite(s) ? s : null;
      ta += Number.isFinite(a) ? a : 0; tr += Number.isFinite(s) ? s : 0;
    }
    const low = r.GP < Math.max(floor, G_MIN_GP);
    r.tSAA = low ? NaN : ta; r.tSAR = low ? NaN : tr;
  }
  return rows;
}
if (typeof module !== 'undefined') module.exports = { skaterWindow, perGame, skaterParams, scoreSkaters, goalieWindow, goalieParams, scoreGoalies, xlRound, median, sd, percentileInc, SK_CATS_F, SK_CATS_D, G_CATS };
</script>

}

       <td>${r.age ?? ''}</td><td class="l">${ownerPill(r)}</td><td>${r.aav != null ? money(r.aav) : '<span class="dim">$1M</span>'}</td><td>${r.GP}</td>
       <td><b>${f2(r.tSAR)}</b></td><td class="dim">${f2(r.tSAA)}</td><td>${f2(r.perM)}</td><td>${Number.isFinite(r.mkt) ? money(r.mkt) : ''}</td>
       <td class="${r.cv > 0.25 ? '' : 'dim'}">${Number.isFinite(r.cv) ? Math.round(r.cv * 100) + '%' : ''}</td>${catCells(r, cats)}</tr>`).join('')}
   </tbody></table></div>
   ${rows.length > S.limit ? `<div class="note"><button id="more">Show ${Math.min(500, rows.length - S.limit)} more</button></div>` : ''}`;
  $('#grp').onclick = (e) => { const v = e.target.dataset.v; if (v) { S.grp = v; if (v === 'G' && S.sort.k.startsWith('c:')) S.sort = { k: 'tSAR', dir: -1 }; tabPlayers(); } };
  $('#owner').onchange = (e) => { S.owner = e.target.value; tabPlayers(); };
  $('#q').oninput = (e) => { S.q = e.target.value; clearTimeout(tabPlayers.t); tabPlayers.t = setTimeout(() => { tabPlayers(); const q = $('#q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }, 200); };
  const m = $('#more'); if (m) m.onclick = () => { S.limit += 500; tabPlayers(); };
  hookSort($('#ptbl'), tabPlayers);
}

/* ------------------------------------------------------------------ Team needs */
function tabNeeds() {
  const t = S.team;
  const rank = {}, avg = {};
  for (const c of ALL_SK) {
    const vals = DATA.teams.map((_, i) => C.team[i][c] || 0);
    avg[c] = vals.reduce((a, b) => a + b, 0) / vals.length;
    const order = vals.map((v, i) => [v, i]).sort((a, b) => b[0] - a[0]);
    rank[c] = {}; order.forEach(([v, i], k) => (rank[c][i] = k + 1));
  }
  const n = DATA.teams.length, rk = (r) => `rgba(var(--${r <= n / 3 ? 'pos' : r > 2 * n / 3 ? 'neg' : 'pos'}),${(r <= n / 3 ? (n / 3 - r + 1) / (n / 3) * 0.5 : r > 2 * n / 3 ? (r - 2 * n / 3) / (n / 3) * 0.5 : 0).toFixed(3)})`;
  const catRows = ALL_SK.filter((c) => c !== 'GP').map((c) => {
    const v = C.team[t][c] || 0, r = rank[c][t];
    return `<tr class="need ${S.need === c ? 'pick' : ''}" data-c="${c}"><td class="l name">${CAT_LABEL[c]} <span class="dim">${esc(CAT_HELP[c] || '')}</span></td><td>${f2(v)}</td><td>${f2(avg[c])}</td><td style="background:${rk(r)}">${r} / ${n}</td></tr>`;
  }).join('');
  const isD = (r) => r.grp === 'D';
  const list = (grp) => C.sk.filter((r) => r.owner < 0 && Number.isFinite(r.tSAR) && r.sar[S.need] != null && (grp === 'D' ? isD(r) : !isD(r)))
    .sort((a, b) => b.sar[S.need] - a.sar[S.need]).slice(0, 12);
  const fa = (grp) => `<h3>Best free-agent ${grp === 'D' ? 'defensemen' : 'forwards'} in ${CAT_LABEL[S.need]}</h3><div class="tbl"><table><thead><tr><th class="l">Player</th><th class="l">NHL</th><th>GP</th><th>${CAT_LABEL[S.need]} SAR</th><th>per game</th><th>tSAR</th></tr></thead><tbody>` +
    list(grp).map((r) => `<tr><td class="l name">${esc(r.name)}</td><td class="l dim">${esc(r.tm)}</td><td>${r.GP}</td><td style="${heat(r.sar[S.need])}"><b>${f2(r.sar[S.need])}</b></td><td>${S.need === 'GP' ? r.GP : f2(r.pg[S.need])}</td><td>${f2(r.tSAR)}</td></tr>`).join('') + '</tbody></table></div>';
  const gl = C.gk.filter((r) => r.owner < 0 && Number.isFinite(r.tSAR)).sort((a, b) => b.tSAR - a.tSAR).slice(0, 5);
  $('#panel').innerHTML = `<div class="note"><b>${esc(DATA.teams[t].name)}</b>: each category is the sum of SAA (vs. league-average skater) over the team's Active-slot skaters.
    Rank 1 = strongest of ${n} teams. <b>Click a category</b> to list the best free agents in it.</div>
    <div class="two"><div><div class="tbl"><table><thead><tr><th class="l">Category</th><th>Team</th><th>League avg</th><th>Rank</th></tr></thead><tbody>${catRows}</tbody></table></div>
      <h3>Top free-agent goalies</h3><div class="tbl"><table><thead><tr><th class="l">Player</th><th>GP</th><th>tSAR</th></tr></thead><tbody>${gl.map((r) => `<tr><td class="l name">${esc(r.name)} <span class="dim">${esc(r.tm)}</span></td><td>${r.GP}</td><td>${f2(r.tSAR)}</td></tr>`).join('')}</tbody></table></div></div>
    <div>${fa('F')}${fa('D')}</div></div>`;
  document.querySelectorAll('.need').forEach((tr) => (tr.onclick = () => { S.need = tr.dataset.c; tabNeeds(); }));
}

/* ------------------------------------------------------------------ Rosters */
function tabTeams() {
  const t = S.team, mine = DATA.roster.filter((r) => r.t === t);
  const byHr = new Map(C.rows.map((r) => [r.id, r]));
  const block = (g, title, cats) => {
    const rows = mine.filter((r) => r.g === g && r.st !== 'Minors').map((r) => ({ r, s: byHr.get(r.hr) })).sort((a, b) => (b.s && b.s.tSAR || -99) - (a.s && a.s.tSAR || -99));
    const tot = rows.reduce((a, x) => a + (x.s && Number.isFinite(x.s.tSAR) ? x.s.tSAR : 0), 0), aav = rows.reduce((a, x) => a + (x.r.st === 'Inj Res' ? 0 : (x.r.aav ?? DATA.defaultAav)), 0);
    return `<tr class="sep"><td colspan="${9 + cats.length}">${title} - ${rows.length} players, AAV ${money(aav)}, total SAR ${f2(tot)}</td></tr>` +
      rows.map(({ r, s }) => `<tr><td class="l name">${esc(r.n)}</td><td class="l dim">${esc(r.tm || '')}</td><td>${r.age ?? ''}</td><td class="l">${r.st === 'Inj Res' ? '<span class="pill ir">IR</span>' : r.st === 'Reserve' ? '<span class="pill">Res</span>' : ''}</td>
        <td>${r.aav != null ? money(r.aav) : '<span class="dim">$1M</span>'}</td><td>${r.yrs ?? ''}</td><td class="dim">${esc(r.ct || '')}</td><td>${s ? s.GP : ''}</td><td><b>${s ? f2(s.tSAR) : ''}</b></td>${s ? catCells(s, cats) : cats.map(() => '<td></td>').join('')}</tr>`).join('');
  };
  const head = (cats) => `<tr><th class="l">Player</th><th class="l">NHL</th><th>Age</th><th class="l"></th><th>AAV</th><th>Yrs</th><th>Type</th><th>GP</th><th>tSAR</th>${cats.map((c) => `<th class="heat">${CAT_LABEL[c]}</th>`).join('')}</tr>`;
  $('#panel').innerHTML = `<div class="note">${esc(DATA.teams[t].name)} - active, reserve and IR players (minors-slot players are on the Prospects tab). Categories shown as SAR; window and floor as set above.</div>${legend()}
    <div class="tbl"><table><thead>${head(SK_CATS_F)}</thead><tbody>${block('F', 'Forwards', SK_CATS_F)}</tbody></table></div>
    <h3>&nbsp;</h3><div class="tbl"><table><thead>${head(SK_CATS_D)}</thead><tbody>${block('D', 'Defensemen', SK_CATS_D)}</tbody></table></div>
    <h3>&nbsp;</h3><div class="tbl"><table><thead>${head(G_CATS)}</thead><tbody>${block('G', 'Goalies', G_CATS)}</tbody></table></div>`;
}

/* ------------------------------------------------------------------ Cap */
function tabCap() {
  const cap = DATA.cap, L = cap.labels, t = S.team, T = cap.teams[t];
  const col = (v) => `rgba(var(--${v >= 0 ? 'pos' : 'neg'}),${Math.min(Math.abs(v) / 60e6, 1) * 0.55})`;
  const matrix = cap.teams.map((x, i) => `<tr class="${i === t ? 'need pick' : 'need'}" data-t="${i}"><td class="l name">${esc(DATA.teams[i].name)}</td>${L.map((_, y) => `<td style="background:${col(x.space[y])}">${money(x.space[y])}</td>`).join('')}<td class="dim">${money(x.real[0])}</td></tr>`).join('');
  const line = (lbl, arr, neg) => `<tr><td class="l">${lbl}</td>${arr.map((v) => `<td>${v ? (neg ? '−' : '') + money(v) : '<span class="dim">–</span>'}</td>`).join('')}</tr>`;
  const maxAav = Math.max(1, ...T.players.map((p) => p.aav));
  $('#panel').innerHTML = `<div class="note">Cap space by season (cap − active salary − 50% of cut players' salary). IR players count against future seasons but not the current one; minors-slot players carry no cap hit; players with no contract on file count as $1M free-agent contracts. "Real" adds back salary you could cut for free (default $1M contracts). Click a team to see its contracts.</div>
   <div><div class="tbl" style="max-height:none"><table><thead><tr><th class="l">Cap space</th>${L.map((l) => `<th>${l}</th>`).join('')}<th title="this season, adding back free cuts">Real ${L[0].slice(2)}</th></tr></thead><tbody>
     <tr class="sep"><td class="l">Salary cap</td>${cap.caps.map((v) => `<td>${money(v)}</td>`).join('')}<td></td></tr>${matrix}</tbody></table></div>
   <h3>${esc(DATA.teams[t].name)}</h3><div><div class="tbl" style="max-height:none"><table><thead><tr><th class="l">Season</th>${L.map((l) => `<th>${l}</th>`).join('')}</tr></thead><tbody>
     ${line('Active salary', T.active)}${line('Injured reserve', T.ir)}${line('Dead / cut', T.dead, true)}${line('Cap space', T.space)}${line('Real space', T.real)}
     </tbody></table></div>
     <h3>Contracts</h3><div class="tbl"><table><thead><tr><th class="l">Player</th><th>AAV</th><th>Yrs</th><th class="l"></th>${L.map((l) => `<th>${l.slice(2)}</th>`).join('')}</tr></thead><tbody>
     ${T.players.map((p) => `<tr><td class="l name">${esc(p.n)}</td><td>${money(p.aav)}</td><td>${p.yrs}</td><td class="l">${p.st === 'Inj Res' ? '<span class="pill ir">IR</span>' : p.free ? '<span class="pill">free cut</span>' : ''}</td>${p.per.map((v) => `<td>${v ? `<span class="bar" style="width:${Math.max(3, v / maxAav * 40)}px"></span>` : ''}</td>`).join('')}</tr>`).join('')}
     ${T.cuts.map((p) => `<tr><td class="l name dim">${esc(p.n)} (cut)</td><td class="dim">${money(p.aav)}</td><td>${p.yrs}</td><td class="l"><span class="pill">dead 50%</span></td>${p.per.map((v) => `<td class="dim">${v ? money(v) : ''}</td>`).join('')}</tr>`).join('')}
     </tbody></table></div></div></div>`;
  document.querySelectorAll('.need[data-t]').forEach((tr) => (tr.onclick = () => { S.team = +tr.dataset.t; store.set('team', S.team); drawControls(); tabCap(); }));
}

/* ------------------------------------------------------------------ Prospects */
function tabProspects() {
  const t = S.team, n = DATA.teams.length;
  const avg = (list, f) => { const v = list.map(f).filter((x) => x != null && Number.isFinite(x)); return v.length ? v.reduce((p, q) => p + q, 0) / v.length : NaN; };
  const grads = (list) => list.filter((p) => p.gp > 20).length + list.filter((p) => p.lvl === 'NHL' && p.cert === 10).length;
  const grp = (list) => ({ up: avg(list, (p) => p.up), ce: avg(list, (p) => p.cert), n: list.filter((p) => p.cert > 0).length, grad: grads(list), all: list.length });
  const rows = DATA.teams.map((tm, i) => {
    const l = DATA.prospects.filter((p) => p.t === i), g = { F: grp(l.filter((p) => p.g === 'F')), D: grp(l.filter((p) => p.g === 'D')), G: grp(l.filter((p) => p.g === 'G')) };
    const w = g.F.n + g.D.n + g.G.n, wavg = (k) => (w ? ['F', 'D', 'G'].reduce((a, x) => a + (Number.isFinite(g[x][k]) ? g[x][k] * g[x].n : 0), 0) / w : NaN);
    return { i, g, up: wavg('up'), ce: wavg('ce'), star: l.filter((p) => p.up >= 9 && p.cert >= 9).length, maybe: l.filter((p) => p.up >= 9 && p.cert < 9).length, lock: l.filter((p) => p.up < 9 && p.cert >= 9).length,
             a1: l.filter((p) => p.age >= 18 && p.age <= 19).length, a2: l.filter((p) => p.age >= 20 && p.age <= 22).length, a3: l.filter((p) => p.age >= 23).length, grad: g.F.grad + g.D.grad + g.G.grad };
  });
  const fm = (v) => (Number.isFinite(v) ? v.toFixed(2) : '');
  const hc = (v, mid) => `style="${heat((v - mid) * 1.1)}"`;
  const summary = rows.map((r) => `<tr class="${r.i === t ? 'need pick' : 'need'}" data-t="${r.i}"><td class="l name">${esc(DATA.teams[r.i].name)}</td>
     <td ${hc(r.up, 7)}>${fm(r.up)}</td><td>${fm(r.g.F.up)}</td><td>${fm(r.g.D.up)}</td><td>${fm(r.g.G.up)}</td>
     <td ${hc(r.ce, 6.5)}>${fm(r.ce)}</td><td>${fm(r.g.F.ce)}</td><td>${fm(r.g.D.ce)}</td><td>${fm(r.g.G.ce)}</td>
     <td>${r.g.F.n}</td><td>${r.g.D.n}</td><td>${r.g.G.n}</td><td>${r.star}</td><td>${r.maybe}</td><td>${r.lock}</td><td>${r.a1}</td><td>${r.a2}</td><td>${r.a3}</td><td>${r.grad}</td><td>${money(r.grad * 1e6)}</td></tr>`).join('');
  const mine = DATA.prospects.filter((p) => p.t === t).sort((a, b) => (b.up * 10 + b.cert) - (a.up * 10 + a.cert));
  const eta = DATA.etaYears || {};
  $('#panel').innerHTML = `<div class="note">Depth summary as in your workbook. Stars = upside ≥ 9 and certainty ≥ 9; maybe = upside ≥ 9, certainty &lt; 9; locks = upside &lt; 9, certainty ≥ 9. Graduate potential = prospects with &gt; 20 NHL GP plus NHL-level prospects with certainty 10; lost cap = graduates × $1M. Click a team to list its prospects.</div>
   <div class="tbl"><table><thead><tr><th class="l">Team</th><th>Upside</th><th>F</th><th>D</th><th>G</th><th>Certainty</th><th>F</th><th>D</th><th>G</th><th title="prospects with certainty &gt; 0">#F</th><th>#D</th><th>#G</th><th>Stars</th><th>Maybe</th><th>Locks</th><th>18-19</th><th>20-22</th><th>23+</th><th>Grads</th><th>Lost cap</th></tr></thead><tbody>${summary}</tbody></table></div>
   <h3>${esc(DATA.teams[t].name)} prospects</h3>
   <div class="tbl"><table><thead><tr><th class="l">Player</th><th class="l">Pos</th><th>Age</th><th class="l">Level</th><th>ETA yrs</th><th>Upside</th><th>Certainty</th><th>NHL GP</th><th class="l">Trajectory</th><th class="l">Next season</th></tr></thead><tbody>
   ${mine.map((p) => `<tr><td class="l name">${esc(p.n)}</td><td class="l">${esc(p.g)}</td><td>${p.age ?? ''}</td><td class="l">${esc(p.lvl || '')}</td><td>${eta[p.lvl] ?? ''}</td><td style="${heat((p.up - 7) * 1.2)}">${p.up ?? ''}</td><td style="${heat((p.cert - 5) * .6)}">${p.cert ?? ''}</td><td>${p.gp || ''}</td><td class="l">${esc(p.traj || '')}</td><td class="l">${esc(p.nxt || '')}</td></tr>`).join('')}</tbody></table></div>`;
  document.querySelectorAll('.need[data-t]').forEach((tr) => (tr.onclick = () => { S.team = +tr.dataset.t; store.set('team', S.team); drawControls(); tabProspects(); }));
}

/* ------------------------------------------------------------------ Changes */
function tabChanges() {
  const ch = DATA.changes;
  const d = (s) => { const x = new Date(s); return isNaN(x) ? s : x.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); };
  $('#panel').innerHTML = ch.length ? `<div class="note">Roster moves detected from Fantrax (checked hourly). Times are when the change was detected.</div>
    <div class="tbl"><table><thead><tr><th class="l">Detected</th><th class="l">Move</th><th class="l">Player</th><th class="l">From</th><th class="l">To</th><th class="l">Status</th></tr></thead><tbody>
    ${ch.map((c) => `<tr><td class="l dim">${esc(d(c.at))}</td><td class="l">${esc(c.ev)}</td><td class="l name">${esc(c.p)} <span class="dim">${esc(c.nhl || '')} ${esc(c.pos || '')}</span></td><td class="l">${esc(c.frm || '')}</td><td class="l">${esc(c.to || '')}</td><td class="l dim">${esc([c.fs, c.ts].filter(Boolean).join(' → '))}</td></tr>`).join('')}</tbody></table></div>`
    : '<div class="empty">No roster changes detected yet - the first ones will appear here as soon as someone adds, drops or trades a player.</div>';
}

/* ------------------------------------------------------------------ Method */
function tabMethod() {
  const row = (g, P) => (g === 'G' ? G_CATS : SKC[g]).map((c) => `<tr><td class="l">${g} · ${CAT_LABEL[c]}</td><td>${P[c].med.toFixed(c === 'SV' ? 3 : 2)}</td><td>${P[c].sd.toFixed(c === 'SV' ? 4 : 3)}</td><td>${P[c].repl.toFixed(c === 'SV' ? 3 : 2)}</td></tr>`).join('');
  $('#panel').innerHTML = `<div class="two"><div>
   <h3>How the numbers work (same as your workbook)</h3>
   <div class="note"><b>Per-game stats</b> are rounded to 2 decimals (PT-D for defensemen only, G, A, 2G+A, PIM, SOG, STP, Hit, Blk, TK, Cor); GP is used as a total. <b>Cor</b> = CF − CF against.<br>
   <b>SAA</b> = (player − median) ÷ SD, where median and SD come from the pool of players (forwards and defensemen separately). <b>SAR</b> = (player − replacement) ÷ SD, where replacement is the median of free agents who played more than the 25th-percentile of free-agent games. Totals (tSAA / tSAR) are the sums over categories. Goalies use GP, W, GAA (lower is better), SV% and SHO, with a 5-game minimum.<br>
   <b>Blend</b> pools both seasons' totals, so a player's per-game rate is weighted by games played; choosing a single season reproduces the workbook exactly. <b>Min games to rank</b> hides tSAR for small samples but never changes the medians, SDs or replacement levels.<br>
   <b>Cor fix:</b> the workbook's Corsi lookup stopped at row 1011 of a 1063-row table, so ~50 players near the end of the alphabet showed Cor = 0. Here every stat is joined on the Hockey-Reference player ID, so that can't happen.<br>
   <b>Market $</b> = tSAR ÷ the median SAR-per-$M of owned players at that position × $1M (floor $1M); <b>Value</b> = (market − AAV) ÷ market.</div>
   <h3>Choices you can flip</h3>
   <div class="note"><b>Pool = Real contracts</b> uses owned players on a negotiated contract for the median/SD, as the workbook did, but without the $0.1M prospect placeholders (Fantrax ownership now keeps prospects off the free-agent list, so the placeholder isn't needed). Players picked up as $1M free agents are excluded, as in the workbook. <b>All owned players</b> uses everyone currently on a team, prospects included. Free agents (replacement pool) are always players not on any Fantrax roster.</div>
   <h3>Data</h3>
   <div class="note">Stats: Hockey-Reference season tables (updated ${esc(DATA.asof.stats || 'n/a')}). Rosters: Fantrax (${esc(DATA.asof.roster || 'n/a')}).<br>
   ${C.sk.length} skaters and ${C.gk.length} goalies with games in the selected window.</div></div>
   <div><h3>Parameters in use (window: ${S.win === 'blend' ? 'blend' : DATA.seasonLabel[S.win]})</h3>
   <div class="note">Pools - F: ${C.P.F.nPool} median/SD, ${C.P.F.nRepl} replacement (> ${C.P.F.threshold} GP). D: ${C.P.D.nPool}, ${C.P.D.nRepl} (> ${C.P.D.threshold}). G: ${C.PG.nPool}, ${C.PG.nRepl} (> ${C.PG.threshold}).</div>
   <div class="tbl"><table><thead><tr><th class="l">Category</th><th>Median</th><th>SD</th><th>Replacement</th></tr></thead><tbody>${row('F', C.P.F)}${row('D', C.P.D)}${row('G', C.PG)}</tbody></table></div></div></div>`;
}

/* ------------------------------------------------------------------ boot */
$('#title').textContent = DATA.league;
$('#asof').textContent = 'Stats updated ' + (DATA.asof.stats ? new Date(DATA.asof.stats).toLocaleString() : 'n/a') + ' · rosters ' + (DATA.asof.roster ? new Date(DATA.asof.roster).toLocaleString() : 'n/a');
drawTabs(); refresh();
</script>
</body>
</html>
