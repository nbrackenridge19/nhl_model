name: Generate dashboard

# Runs on the same frequent schedule as the other scrapers -- cheap to run
# (pure database reads), so no gameday pre-check needed. Only commits back
# to the repo if the generated HTML actually changed, to avoid a flood of
# empty commits when nothing's new.
on:
  schedule:
    # 11:00-04:59 UTC = 7am-12:59am ET, so evening T-5 signals and the skater check show up before puck drop.
    - cron: "*/10 11-23,0-4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install psycopg2-binary

      - name: Generate dashboard
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGPORT: ${{ secrets.PGPORT }}
        run: python scripts/nhl_generate_dashboard.py

      # Two dashboard runs can overlap (e.g. two games with the same puck drop each trigger a
      # refresh in the same minute, or a trigger lands next to the 10-minute cron). Both rewrite
      # the same generated file, so a plain push loses the race and fails. On a rejected push,
      # rebase onto the latest main and keep THIS run's freshly generated version of the file
      # (-X theirs = the commit being replayed, i.e. ours), then push again.
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update dashboard"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $i rejected; rebasing onto latest main and retrying"
            git pull --rebase -X theirs origin main || git rebase --abort || true
            sleep $(( (RANDOM % 5) + 2 ))
          done
          echo "Failed to push after 5 attempts"
          exit 1
