name: NHL T-5 Scheduler (sync Worker alarms)

# Keeps the Cloudflare Worker's per-game Durable Object alarms in sync with the real
# NHL schedule -- looks up each upcoming game's actual puck-drop time on ESPN and POSTs
# it to the Worker's /schedule endpoint, which sets that game's alarm for exactly T-5.
# Cheap (two small JSON fetches, no DB writes except reads) and idempotent -- calling it
# again for a game just resets the alarm to whatever start time ESPN currently shows, so
# running this often is fine and is how postponements/time changes get picked up.
#
# Triggered two ways: (1) the Cloudflare Worker's own cron trigger fires a "t5-schedule"
# repository_dispatch every 30 minutes (the reliable path -- Cloudflare's scheduler, not GitHub's),
# and (2) GitHub's own cron below, kept as a redundant backup. Running both is harmless.

on:
  repository_dispatch:
    types: [t5-schedule]
  schedule:
    - cron: '*/30 * * * *'  # backup only -- the Worker's cron trigger is the primary
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (true = no POSTs to the Worker)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      lookahead_days:
        description: 'Days ahead of today to schedule (automatic runs always use 3)'
        required: true
        default: '3'
        type: string

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests psycopg2-binary

      - name: Sync Worker alarms with the schedule
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGPORT: ${{ secrets.PGPORT }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          LOOKAHEAD_DAYS: ${{ github.event.inputs.lookahead_days || '3' }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SCHEDULE_SECRET: ${{ secrets.SCHEDULE_SECRET }}
        run: python scripts/nhl_t5_scheduler.py
