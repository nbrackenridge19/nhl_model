name: NHL Odds Ingest

on:
  schedule:
    - cron: '*/10 * * * *'  # every 10 minutes -- FALLBACK ONLY: captures games already at/past puck drop that the T-5 path missed
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (true = no DB writes)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests psycopg2-binary

      - name: Run odds ingest
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGPORT: ${{ secrets.PGPORT }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          # 0 = only capture games that have already started. The T-5 path (t5-trigger.yml) owns the
          # pre-game capture; with the old default of 60 this cron grabbed the line ~50-60 min before
          # puck drop and the T-5 run then found "odds already captured".
          CAPTURE_WINDOW_MINUTES_BEFORE: '0'
        run: python scripts/nhl_odds_ingest.py
