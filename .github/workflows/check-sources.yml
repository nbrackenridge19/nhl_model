name: Check data sources

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run source check
        run: python scripts/nhl_check_sources.py

      - name: Run ESPN event-lookup check (odds groundwork)
        run: python scripts/nhl_diagnose_espn_event_lookup.py 2026-09-19 2026-09-20
