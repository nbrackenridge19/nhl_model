name: NHL Lineup & Goalie - Freeze missed games (morning safety net)

# The real final freeze happens at T-5 (t5-trigger.yml). This job only covers a game whose T-5 freeze never
# happened (Worker outage, etc.): for recent finished games with live rows but no 'confirmed' rows, it copies the
# latest live rows to 'confirmed'. 09:00 UTC = 5am ET (EDT) / 4am ET (EST) -- after every game of the prior night,
# before the daily results ingest at 13:00 UTC.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (true = no DB writes)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests psycopg2-binary

      - name: Freeze any missed games
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGPORT: ${{ secrets.PGPORT }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          RUN_MODE: freeze_missed
        run: python scripts/nhl_lineup_goalie_ingest.py
