name: T5 Dispatch Test (temporary)

# Fires when the Cloudflare Worker's alarm calls GitHub's repository_dispatch API at T-5 for a game.
# This is a throwaway proof step -- once we've confirmed the Worker can successfully trigger a real
# Actions run, this file gets deleted and replaced with the real odds/lineup T-5 workflow.

on:
  repository_dispatch:
    types: [t5-trigger]

jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - name: Echo the dispatched game_id
        run: |
          echo "Received t5-trigger dispatch"
          echo "game_id: ${{ github.event.client_payload.game_id }}"
          echo "Full payload: ${{ toJSON(github.event.client_payload) }}"
